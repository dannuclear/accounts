<button type="button" class="btn btn-sm btn-outline-light p-1" id="switch-user-btn" title="Сменить пользователя" data-bs-toggle="modal" data-bs-target="#switchUserModal">
  <i class="fa-duotone fa-arrows-rotate"></i>
</button>

<div class="modal fade" id="switchUserModal" tabindex="-1" aria-labelledby="switchUserModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm" style="max-width: 380px;">
    <div class="modal-content">
      <div class="modal-header py-2 px-3">
        <h6 class="modal-title mb-0" id="switchUserModalLabel">
          <i class="fa-duotone fa-user-switch"></i>&nbsp;Смена пользователя
        </h6>
        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body py-2 px-3">
        <select id="change-user" name="current_user" class="form-select form-select-sm">
          <option value="z57098001" {% if request.META.REMOTE_USER == 'z57098001' %}selected{% endif %}>Подотчетное лицо (z57098001)</option>
          <option value="buh"       {% if request.META.REMOTE_USER == 'buh' %}selected{% endif %}>Бухгалтер (buh)</option>
          <option value="admin"     {% if request.META.REMOTE_USER == 'admin' %}selected{% endif %}>Администратор (admin)</option>
          <option value="norms"     {% if request.META.REMOTE_USER == 'norms' %}selected{% endif %}>Нормоконтроль (norms)</option>
          <option value="chief"     {% if request.META.REMOTE_USER == 'chief' %}selected{% endif %}>Руководитель (chief)</option>
          <option value="user"      {% if request.META.REMOTE_USER == 'user' %}selected{% endif %}>Подотчетное лицо (user)</option>
          <option value="z12345"    {% if request.META.REMOTE_USER == 'z12345' %}selected{% endif %}>z12345</option>
        </select>
      </div>
      <div class="modal-footer py-2 px-3 gap-1">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-sm btn-success" id="switch-user-apply">
          <i class="fa-duotone fa-right-to-bracket"></i>&nbsp;Сменить
        </button>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
  $(document).ready(function () {
    $('#switch-user-apply').on('click', function () {
       const selectedUser = $('#change-user').val();
       document.cookie = `username=${selectedUser}; path=/;`;
       window.location.reload();
     });
  });
</script>
