{% now '01.m.Y' as default_from %}
{% now 't.m.Y' as default_to %}

<div id="period-filter" class="input-group input-group-sm">
  <span class="input-group-text">Период с</span>
  <input id="period-from" value="{{ period_from|date:'d.m.Y'|default:default_from }}" class="form-control text-center filter-input datepeeker" />
  <span class="input-group-text">по</span>
  <input id="period-to" value="{{ period_to|date:'d.m.Y'|default:default_to }}" class="form-control text-center filter-input datepeeker" />
  <button type="button" class="btn btn-sm btn-outline-success">X</button>
</div>

<script type="text/javascript">
  const periodFilter = $('#period-filter')
  const periodFromInput = periodFilter.find('#period-from')
  const periodToInput = periodFilter.find('#period-to')

  $(function () {
    const STORAGE_KEY = 'periodFilter';
    const SAVE_STATE = {% if save_state|default_if_none:True %}true{% else %}false{% endif %};
    const inputs = periodFromInput.add(periodToInput);

    const update = () => {
      inputs.each(function () {
        this.classList.toggle('bg-warning', !!this.value);
      });

      if (SAVE_STATE) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          from: periodFromInput.val(),
          to: periodToInput.val()
        }));
      }
    };

    if (SAVE_STATE) {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
          periodFromInput.val(saved.from);
          periodToInput.val(saved.to);
        }
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    inputs.on('change', update);

    periodFilter.find('button').on('click', function () {
      inputs.val('');
      update();
    });

    inputs.each(function () {
      this.classList.toggle('bg-warning', !!this.value);
    });
  });
</script>
