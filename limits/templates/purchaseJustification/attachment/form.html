<div class="border rounded p-1 attachment-row" data-prefix="{{ form.prefix }}">
  {{ form.id }}
  {{ form.file }}
  {% comment %} {{ form.errors }} {% endcomment %}

  <div class="row g-1 align-items-center">
    <div class="col">
      {% include 'main/input_group.html' with field=form.name label='Наименование:' %}
    </div>

    <div class="col-1">
      {% if form.instance.file %}
        <a href="{{ form.instance.file.url }}" target="_blank" class="btn btn-sm btn-success w-100 btn-view-file"><i class="fa-light fa-eye"></i> Просмотр</a>
      {% elif not read_only == True %}
        <button type="button" class="btn btn-sm btn-dark btn-upload-file w-100"><i class="fa-light fa-upload"></i> Загрузить</button>
      {% endif %}
    </div>
  </div>
</div>

</script>
