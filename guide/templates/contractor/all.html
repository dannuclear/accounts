{% extends 'main/base.html' %}

{% block title %}
  Контрагенты
{% endblock %}

{% block content %}
  <div class="alert alert-primary" role="alert" style="display: none;"></div>
  <table id="contractor-table" class="table table-sm table-bordered table-striped table-hover">
    <thead>
      <tr>
        <th style="width: 2%">№</th>
        <th style="width: 30%">Краткое наименование</th>
        <th style="width: 40%">Юридический адрес</th>
        <th style="width: 10%">ИНН</th>
        <th style="width: 10%">Телефон</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
  </table>

  <script type="text/javascript">
    $(document).ready(function () {
      $('#contractor-table').DataTable({
        ajax: {
          url: "{% url 'contractor-list' %}?format=datatables",
          data: function (d) {}
        },
        rowId: 'id',
        columns: [
          {
            data: 'id'
          },
          {
            data: 'short_name'
          },
          {
            data: 'legal_address'
          },
          {
            data: 'inn'
          },
          {
            data: 'phone'
          },
          editColumn("{% url 'contractors' %}", null),
          deleteColumn("{% url 'contractors' %}", null, 'Удалить контрагента?')
        ],
        buttons: [addButton("{% url 'contractors' %}")]
      })
    })
  </script>
{% endblock %}
